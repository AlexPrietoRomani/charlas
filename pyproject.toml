[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "charlas"
version = "2.0.0"
description = "Repositorio multicharla y generador compartido de presentaciones HTML autocontenidas"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Alex Prieto Romani", email = "alexprieto1997@gmail.com" }
]
license = { text = "MIT" }
keywords = ["talks", "presentations", "forecasting", "html-deck", "astro", "python"]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "playwright>=1.40.0",
]

[tool.setuptools.packages.find]
include = ["shared*", "hub*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
