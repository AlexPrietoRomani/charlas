name: Build and Deploy Charlas Hub to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "talks/2026-falsa-alarma/pnpm-lock.yaml"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyyaml

      - name: Install Astro dependencies
        run: pnpm --dir talks/2026-falsa-alarma install --frozen-lockfile

      - name: Build Charlas Hub and Talks
        run: python scripts/build_all.py --base-path /charlas

      - name: Run unit and integration tests
        run: python -m pytest tests/unit tests/integration -v

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
