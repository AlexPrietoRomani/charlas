<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Portada plantilla Python Deck">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03050F"/>
      <stop offset="55%" stop-color="#08112E"/>
      <stop offset="100%" stop-color="#0C173D"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12C8FC"/>
      <stop offset="50%" stop-color="#1E7BFF"/>
      <stop offset="100%" stop-color="#9B5CFF"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#12C8FC" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <circle cx="980" cy="140" r="210" fill="#12C8FC" fill-opacity="0.08"/>
  <circle cx="1060" cy="520" r="240" fill="#9B5CFF" fill-opacity="0.10"/>

  <!-- Insignia superior -->
  <rect x="84" y="84" width="236" height="36" rx="18" fill="#0B1638" stroke="#12C8FC" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="202" y="107" text-anchor="middle" fill="#12C8FC" font-family="monospace" font-size="14" font-weight="700" letter-spacing="1.8">PYTHON-DECK TEMPLATE</text>

  <!-- Título de portada -->
  <text x="84" y="215" fill="#FFFFFF" font-family="sans-serif" font-size="52" font-weight="700">Tu Nueva Charla en</text>
  <text x="84" y="280" fill="url(#accentGrad)" font-family="sans-serif" font-size="52" font-weight="700">Python + Chart.js Offline</text>
  <text x="84" y="340" fill="#CBD5E1" font-family="sans-serif" font-size="24">Deck single-file con notas del orador [N] y datos embebidos</text>

  <!-- Mini gráfica decorativa -->
  <g transform="translate(760, 220)">
    <rect x="0" y="0" width="356" height="240" rx="16" fill="#0B1638" fill-opacity="0.88" stroke="#12C8FC" stroke-opacity="0.3"/>
    <rect x="36" y="148" width="38" height="56" rx="6" fill="#1E7BFF" fill-opacity="0.75"/>
    <rect x="92" y="114" width="38" height="90" rx="6" fill="#12C8FC" fill-opacity="0.85"/>
    <rect x="148" y="88" width="38" height="116" rx="6" fill="#9B5CFF" fill-opacity="0.85"/>
    <rect x="204" y="60" width="38" height="144" rx="6" fill="#2EE6A6" fill-opacity="0.9"/>
    <rect x="260" y="96" width="38" height="108" rx="6" fill="#FFC857" fill-opacity="0.85"/>
    <polyline points="55,134 111,98 167,72 223,46 279,80" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="223" cy="46" r="6" fill="#2EE6A6" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Firma personal -->
  <line x1="84" y1="535" x2="1116" y2="535" stroke="#12C8FC" stroke-opacity="0.22" stroke-width="1.5"/>
  <text x="84" y="582" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="600">Alex Prieto Romani</text>
  <text x="84" y="612" fill="#A9B8DA" font-family="monospace" font-size="15">github.com/AlexPrietoRomani/charlas</text>
</svg>
