<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Portada: Aplicación de SDD en proyectos reales">
  <defs>
    <style>
      .ink { fill: #0F172A; }
      .sub { fill: #475569; }
      .cobalt { fill: #1E40AF; }
      .frame { fill: none; stroke: #E2E8F0; stroke-width: 2; }
      .flow { fill: none; stroke: #1E40AF; stroke-width: 3; stroke-linecap: round;
              stroke-dasharray: 12 10; animation: dash 3s linear infinite; }
      .flow-soft { fill: none; stroke: #047857; stroke-width: 3; stroke-linecap: round;
                   stroke-dasharray: 12 10; animation: dash 3s linear infinite reverse; }
      @keyframes dash { to { stroke-dashoffset: -44; } }
      .chip { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.5; }
      .dot { fill: #FFFFFF; stroke: #1E40AF; stroke-width: 2.5; }
    </style>
    <pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#CBD5E1" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Fondo alabastro Bento -->
  <rect width="1200" height="630" fill="#F4F6FA"/>
  <rect width="1200" height="630" fill="url(#dotgrid)"/>

  <!-- Marco editorial fino -->
  <rect x="36" y="36" width="1128" height="558" class="frame"/>

  <!-- Línea de acento cobalto -->
  <rect x="96" y="150" width="72" height="6" rx="3" fill="#1E40AF"/>

  <!-- Kicker -->
  <text x="96" y="122" font-family="'IBM Plex Mono', 'Consolas', monospace" font-size="19"
        letter-spacing="4" fill="#1E40AF">TALLER · 2 HORAS · 5 BLOQUES</text>

  <!-- Título principal -->
  <text x="96" y="228" font-family="'Space Grotesk', 'IBM Plex Sans', 'Segoe UI', sans-serif"
        font-size="62" font-weight="700" class="ink">Aplicación de SDD</text>
  <text x="96" y="298" font-family="'Space Grotesk', 'IBM Plex Sans', 'Segoe UI', sans-serif"
        font-size="62" font-weight="700" class="ink">en proyectos reales</text>

  <!-- Subtítulo -->
  <text x="96" y="366" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="25" class="sub">SDD + flexibilidad ODD + rigor EGM (+ EDD) con project-suite</text>
  <text x="96" y="400" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="25" class="sub">en un proyecto real de Data Science</text>

  <!-- Chips de pilares -->
  <g font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="18" font-weight="600">
    <rect x="96" y="440" width="110" height="42" rx="21" class="chip"/>
    <text x="151" y="467" text-anchor="middle" fill="#1E40AF">SDD</text>
    <rect x="218" y="440" width="110" height="42" rx="21" class="chip"/>
    <text x="273" y="467" text-anchor="middle" fill="#B45309">ODD</text>
    <rect x="340" y="440" width="110" height="42" rx="21" class="chip"/>
    <text x="395" y="467" text-anchor="middle" fill="#047857">EGM</text>
    <rect x="462" y="440" width="190" height="42" rx="21" class="chip"/>
    <text x="557" y="467" text-anchor="middle" fill="#0F172A">Data Science</text>
  </g>

  <!-- Diagrama de flujo inferior: Vibe -> SDD -> ODD -> EGM -->
  <g>
    <path class="flow" d="M 96 540 H 380"/>
    <path class="flow-soft" d="M 470 540 H 1100"/>
    <g font-family="'IBM Plex Mono', 'Consolas', monospace" font-size="17">
      <text x="96" y="520" fill="#B91C1C" font-weight="600">VIBE CODING</text>
      <text x="400" y="520" fill="#1E40AF" font-weight="600">SDD</text>
      <text x="700" y="520" fill="#B45309" font-weight="600">ODD</text>
      <text x="1000" y="520" fill="#047857" font-weight="600">EGM + EDD</text>
    </g>
    <circle cx="96" cy="540" r="7" class="dot"/>
    <circle cx="396" cy="540" r="7" class="dot"/>
    <circle cx="686" cy="540" r="7" class="dot"/>
    <circle cx="1100" cy="540" r="7" class="dot" stroke="#047857"/>
    <circle r="4.5" fill="#1E40AF">
      <animateMotion dur="5s" repeatCount="indefinite" path="M 96 540 H 1100"/>
    </circle>
  </g>

  <!-- Pie: autor y fecha -->
  <g font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="17" fill="#475569">
    <text x="1104" y="96" text-anchor="end">Alex Prieto Romani · 2026-11-14</text>
  </g>
</svg>
